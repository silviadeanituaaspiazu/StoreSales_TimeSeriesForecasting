[project]
name = "storesales-timeseriesforecasting"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.15"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pyarrow (>=26.0.1,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black[jupyter] (>=26.10.1,<27.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.poetry]
packages = [
    { include = "storesales", from = "src" }
]