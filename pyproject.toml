[project]
name = "storesales-timeseriesforecasting"
version = "0.1.0"
description = ""
authors = [
    {name = "Silvia de Anitua Aspiazu",email = "silviadeanitua@gmail.com"}
]
packages = [{include = "src"}]
requires-python = ">=3.15,<4.0"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "xgboost (>=3.4.1,<4.0.0)",
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "pyarrow (>=26.0.1,<27.0.0)",
    "mlflow (>=3.18.0,<4.0.0)",
    "graphql-core (==3.2.3)",
    "graphene (==3.2.2)",
    "lightgbm (>=4.7.0,<5.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "plotly-express (>=0.4.1,<0.5.0)",
    "nbformat (>=5.11.1,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black[jupyter] (>=26.10.1,<27.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.poetry]
packages = [
    { include = "storesales", from = "src" }
]